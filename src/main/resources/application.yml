spring:
  application:
    name: NDConsultas-BOT
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

whatsapp:
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID}
  api-key: ${WHATSAPP_API_KEY}
  verify-token: ${VERIFY_TOKEN}
  api-version: ${WHATSAPP_API_VERSION:v22.0}

central:
  api-key: ${CENTRAL_API_KEY}

apibrasil:
  bearer-token: ${APIBRASIL_BEARER_TOKEN}

portaldespachantes:
  chave-acesso: ${PORTAL_DESPACHANTES_CHAVE_ACESSO:}

admin:
  phone-number: ${ADMIN_PHONE_NUMBER}

bot:
  logo-url: ${BOT_LOGO_URL:https://i.ibb.co/yD4t24w/logo-nd.jpg}

bancobrasil:
  api-url: ${BB_DEBITOS_API_URL:https://api-ip.bb.com.br/debitos-veiculares/v1}
  app-key: ${BB_APP_KEY:}
  client-id: ${BB_CLIENT_ID:}
  client-secret: ${BB_CLIENT_SECRET:}
  oauth-url: ${BB_OAUTH_URL:https://oauth.bb.com.br/oauth/token}

syncpay:
  api-url: ${SYNCPAY_API_URL:https://api.syncpayments.com.br}
  client-id: ${SYNCPAY_CLIENT_ID}
  client-secret: ${SYNCPAY_CLIENT_SECRET}
  webhook-url: ${SYNCPAY_WEBHOOK_URL}
  webhook-secret: ${SYNCPAY_WEBHOOK_SECRET:}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.ndconsultas.bot_whatsapp: INFO
